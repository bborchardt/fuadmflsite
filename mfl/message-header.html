<!-- FUAD league code, served from GitHub Pages. Goes in a home page message set to appear on all league pages. -->
<style>html.fuad-cloak { background: #0D1117; } html.fuad-cloak body { visibility: hidden; }</style>
<script>
    // A beta or preview starts after MFL's page has painted: hide the page until that version has
    // drawn (it shows it again), for at most 10 seconds.
    try {
        if (localStorage.getItem("fuad.beta") || localStorage.getItem("fuad.preview")) {
            document.documentElement.classList.add("fuad-cloak");
            setTimeout(function () { document.documentElement.classList.remove("fuad-cloak"); }, 10000);
        }
    } catch (e) {}
    function fuadUnavailable() {
        document.documentElement.classList.remove("fuad-cloak");
        var show = function () {
            ["fuad-contracts", "commishdiv", "fuadlinksdiv"].forEach(function (id) {
                var mount = document.getElementById(id);
                if (mount) { mount.innerHTML = '<div class="fuad-unavailable">League tools are temporarily unavailable. MFL&rsquo;s own pages still work.</div>'; }
            });
        };
        if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", show); } else { show(); }
    }
</script>
<link rel="stylesheet" href="https://bborchardt.github.io/fuadmflsite/v1/fuad.css">
<script type="module" src="https://bborchardt.github.io/fuadmflsite/v1/fuad.js" onerror="fuadUnavailable()"></script>

<!-- FUAD league code, served from GitHub Pages. Goes in a home page message set to appear on all league pages. -->
<style>
    html.fuad-cloak { background: #0D1117; }
    html.fuad-cloak body { visibility: hidden; }
    html.fuad-cloak::after { content: "Loading\2026"; position: fixed; top: 40%; left: 0; right: 0; text-align: center; font: 15px -apple-system, system-ui, sans-serif; color: #8B949E; }
</style>
<script>
    // Loads MAIN, or the beta a member chose straight away (not through MAIN, a second download on a
    // slow phone). A choice being made or changed (?fuadBeta=, ?fuadPreview=, a stored preview) goes
    // through MAIN, which decides (site/vN/loader.js). docs/design.md: previews and the beta.
    var fuadLoad = (function () {
        var MAIN = "v1";
        var BASE = "https://bborchardt.github.io/fuadmflsite/";
        var root = document.documentElement;
        var stored = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
        var params = new URLSearchParams(location.search);
        var offer = window.fuadBeta;
        var team = function (id) { return String(id).padStart(4, "0"); };
        var offered = offer && /^v\d+$/.test(String(offer.version)) && offer.version !== MAIN
            && (!Array.isArray(offer.teams) || offer.teams.map(team).indexOf(team(window.franchise_id)) >= 0);
        var direct = offered && !params.has("fuadBeta") && !params.has("fuadPreview") && !stored("fuad.preview")
            && stored("fuad.beta") === offer.version;
        var version = direct ? offer.version : MAIN;

        // hidden until the version has drawn (it shows the page again), so MFL's page doesn't show first;
        // after 20 seconds, whatever is there shows. v1 draws only its own tabs, so it's hidden only while
        // a choice may hand the page on
        if (version !== "v1" || stored("fuad.beta") || stored("fuad.preview") || params.has("fuadBeta") || params.has("fuadPreview")) {
            root.classList.add("fuad-cloak");
            setTimeout(function () { root.classList.remove("fuad-cloak"); }, 20000);
        }

        var whenBody = function (then) {
            if (document.body && document.readyState !== "loading") { then(); } else { document.addEventListener("DOMContentLoaded", then); }
        };
        // MAIN didn't load or start: MFL's own pages, with a note where the custom tabs would be
        var unavailable = function () {
            root.classList.remove("fuad-cloak");
            whenBody(function () {
                ["fuad-contracts", "commishdiv", "fuadlinksdiv"].forEach(function (id) {
                    var mount = document.getElementById(id);
                    if (mount) { mount.innerHTML = '<div class="fuad-unavailable">League tools are temporarily unavailable. MFL&rsquo;s own pages still work.</div>'; }
                });
            });
        };
        // the beta didn't load or start: MAIN runs the page, with the bar that leads out of the beta. As
        // handed the page, but not in the beta ("fallback", not "beta"), so MAIN doesn't act as the beta
        var fallen = false;
        var fallBack = function () {
            var sheet = document.getElementById("fuad-css");
            if (sheet) { sheet.remove(); }
            fallen = true;
            window.fuadLoader = {mode: "fallback", barShown: true};
            whenBody(function () {
                var bar = document.createElement("div");
                var out = new URL(location.href);
                out.searchParams.set("fuadBeta", "off");
                bar.id = "fuad-preview";
                bar.textContent = "The beta couldn\u2019t load, so this is the current site. ";
                var link = document.createElement("a");
                link.href = out.href;
                link.textContent = "Leave the beta";
                bar.appendChild(link);
                document.body.appendChild(bar);
            });
            add(MAIN, unavailable, function () { if (!window.fuadLoader.started) { unavailable(); } });
        };
        var add = function (which, onerror, onload) {
            var css = document.createElement("link");
            css.id = "fuad-css";
            css.rel = "stylesheet";
            css.href = BASE + which + "/fuad.css";
            document.head.appendChild(css);
            var js = document.createElement("script");
            js.type = "module";
            js.src = BASE + which + "/fuad.js";
            js.onerror = onerror;
            js.onload = onload;
            document.head.appendChild(js);
        };
        if (direct) {
            // as if MAIN had handed the page over; the version draws its own bar
            window.fuadLoader = {mode: "beta", feedback: /^https:\/\//.test(String(offer.feedback || "")) ? String(offer.feedback) : null, barShown: false};
        }
        var done = false;
        var failed = function () {
            if (!done) {
                done = true;
                (direct ? fallBack : unavailable)();
            }
        };
        // fetched but not started (a syntax error, a failing import): MAIN sets window.fuadLoader as it
        // starts, a version handed the page sets .started
        var started = function () { return Boolean(window.fuadLoader && (!direct || window.fuadLoader.started)); };
        var loaded = function () { if (!started()) { failed(); } };
        // Safari reports a syntax error in a module only to the page, with no load or error event
        window.addEventListener("error", function (event) {
            if (event.filename === BASE + version + "/fuad.js" && !started()) {
                failed();
            } else if (fallen && event.filename === BASE + MAIN + "/fuad.js" && !window.fuadLoader.started) {
                unavailable();
            }
        });
        // written into the page while it's being read, so the stylesheet holds the first paint as a link
        // in the page would; added by script if this runs later, where writing would replace the page
        if (document.readyState === "loading") {
            document.write('<link id="fuad-css" rel="stylesheet" href="' + BASE + version + '/fuad.css">'
                + '<script type="module" src="' + BASE + version + '/fuad.js" onerror="fuadLoad.failed()" onload="fuadLoad.loaded()"><\/script>');
        } else {
            add(version, failed, loaded);
        }
        return {failed: failed, loaded: loaded};
    })();
</script>

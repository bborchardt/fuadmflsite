# Daily league chores. See jobs/daily.mjs for what it does.
#
# The job writes only to the league-data branch (franchise snapshots, team icons' stills and the
# chore log), and, to MFL when the DROP_PENALTIES, CONTRACT_YEARS or PAYOUTS variable is "apply": cap
# penalties for dropped players, contract years for added ones, and the payouts in the league's
# accounting.
# master is protected and takes changes through pull requests, so nothing here pushes to it.
#
# A manual run is a dry run unless unticked: jobs/daily.mjs then writes nothing to MFL or league-data,
# so the commit and publish steps below don't run. Its other inputs apply only to a dry run; unticked,
# a manual run is the same as a scheduled one.
#
# GitHub turns off scheduled workflows after 60 days without repository activity, so the
# last step re-enables this workflow on every run.
name: Daily chores

on:
  schedule:
    # off the top of the hour, when GitHub delays scheduled runs the most
    - cron: "37 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: write nothing. The inputs below apply only to a dry run."
        type: boolean
        default: true
      league:
        description: "League id (default: the real league)"
        type: string
      host:
        description: "League's host, as https://www44.myfantasyleague.com; give it when the league is on another (default: the real league's)"
        type: string
      settings:
        description: "An unlisted league's settings, as its header line's: {\"extends\": \"48571\", ...}"
        type: string
      version:
        description: "Rules version, as v2 (default: the real job's)"
        type: string
      season:
        description: "Season (default: the newest the league has a site for)"
        type: string
      now:
        description: "Run as of this ISO time, as 2026-09-10T12:00:00Z (default: now)"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  # a dry run waiting here would otherwise replace a scheduled run waiting here
  group: daily-chores${{ inputs.dry_run == true && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  chores:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.run.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # a dry run tests the code of the branch it's started from
          ref: ${{ inputs.dry_run == true && github.ref || 'master' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # the team icons' stills are made with sharp
      - run: npm ci --omit=dev

      - name: Check out league-data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # exit code 2 means the branch doesn't exist; anything else nonzero is a real problem
          status=0; git ls-remote --exit-code --heads origin league-data > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin league-data
            git worktree add -B league-data league-data FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            echo "No league-data branch yet; starting one"
            git worktree add --orphan -b league-data league-data
          else
            echo "::error::Couldn't reach the repository to check for league-data (git exit $status)"
            exit 1
          fi

      - name: Run chores
        id: run
        env:
          DATA_DIR: league-data
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_LEAGUE_ID: ${{ inputs.dry_run == true && inputs.league || vars.MFL_LEAGUE_ID }}
          MFL_HOST: ${{ inputs.dry_run == true && inputs.host || vars.MFL_HOST }}
          MFL_USER_AGENT: ${{ secrets.MFL_USER_AGENT }}
          RULES_VERSION: ${{ inputs.dry_run == true && inputs.version || vars.RULES_VERSION || 'v2' }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          MFL_SETTINGS: ${{ inputs.dry_run == true && inputs.settings || '' }}
          DATA_LEAGUE_ID: ${{ vars.MFL_LEAGUE_ID }}
          SEASON: ${{ inputs.dry_run == true && inputs.season || '' }}
          NOW: ${{ inputs.dry_run == true && inputs.now || '' }}
          DROP_PENALTIES: ${{ vars.DROP_PENALTIES }}
          CONTRACT_YEARS: ${{ vars.CONTRACT_YEARS }}
          PAYOUTS: ${{ vars.PAYOUTS }}
        run: node jobs/daily.mjs

      - name: Commit to league-data
        if: always() && steps.run.outputs.changed == 'true'
        working-directory: league-data
        run: |
          git add -A
          git commit -m "Daily chores: $(date -u +%Y-%m-%d)"
          git push origin league-data

      - name: Keep this schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"

  publish:
    needs: chores
    if: always() && needs.chores.outputs.publish == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

# Daily league chores. See jobs/daily.mjs for what it does.
#
# The job writes only to the league-data branch (franchise snapshots and the chore log), and,
# to MFL when the DROP_PENALTIES or CONTRACT_YEARS variable is "apply": cap penalties for dropped
# players, and contract years for added ones.
# master is protected and takes changes through pull requests, so nothing here pushes to it.
#
# GitHub turns off scheduled workflows after 60 days without repository activity, so the
# last step re-enables this workflow on every run.
name: Daily chores

on:
  schedule:
    # off the top of the hour, when GitHub delays scheduled runs the most
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-chores
  cancel-in-progress: false

jobs:
  chores:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.run.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check out league-data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # exit code 2 means the branch doesn't exist; anything else nonzero is a real problem
          status=0; git ls-remote --exit-code --heads origin league-data > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin league-data
            git worktree add -B league-data league-data FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            echo "No league-data branch yet; starting one"
            git worktree add --orphan -b league-data league-data
          else
            echo "::error::Couldn't reach the repository to check for league-data (git exit $status)"
            exit 1
          fi

      - name: Run chores
        id: run
        env:
          DATA_DIR: league-data
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_USER_AGENT: ${{ vars.MFL_USER_AGENT }}
          RULES_VERSION: ${{ vars.RULES_VERSION || 'v1' }}
          DROP_PENALTIES: ${{ vars.DROP_PENALTIES }}
          CONTRACT_YEARS: ${{ vars.CONTRACT_YEARS }}
        run: node jobs/daily.mjs

      - name: Commit to league-data
        if: always() && steps.run.outputs.changed == 'true'
        working-directory: league-data
        run: |
          git add -A
          git commit -m "Daily chores: $(date -u +%Y-%m-%d)"
          git push origin league-data

      - name: Keep this schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"

  publish:
    needs: chores
    if: always() && needs.chores.outputs.publish == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

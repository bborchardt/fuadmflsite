# Publishes site/ to GitHub Pages: https://bborchardt.github.io/fuadmflsite/
# Runs on every push to master that touches site/, on demand, and from the daily job
# after it writes a franchise snapshot (pushes made by a workflow don't trigger others).
name: Publish site

on:
  push:
    branches: [master]
    paths: ["site/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

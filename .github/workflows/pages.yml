# Publishes the site to GitHub Pages, at https://<owner>.github.io/<repository>/
# Code comes from master's site/ folder, built by tools/build.mjs (v2 bundled into one minified
# fuad.js); franchise snapshots come from the league-data branch's data/ folder and are published at
# /fuadmflsite/data/.
#
# Runs on every push to master that touches site/ or the build, on demand, and from the daily job when
# league-data has a snapshot the site doesn't (pushes made by a workflow don't trigger others).
name: Publish site

on:
  push:
    branches: [master]
    paths: ["site/**", "tools/build.mjs", "package.json", "package-lock.json"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Add franchise snapshots from league-data
        run: |
          mkdir -p dist/data
          if git fetch --depth=1 origin league-data; then
            git archive FETCH_HEAD data | tar -x -C dist || echo "league-data has no data/ folder yet"
          else
            echo "No league-data branch yet; publishing without snapshots"
          fi
          ls dist/data

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

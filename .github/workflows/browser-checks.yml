# The browser harnesses that pass or fail on their own, from the saved samples in tools/verify/screens/
# and tests/fixtures/pages/; every request is answered by the harness, so nothing reaches MFL.
# screens.py compare and phases.py list differences for a person to read, so they're run by hand.
name: Browser checks

# Runs on every pull request so its checks can be required: when nothing they cover changed, each job
# passes without running the harness, as a paths filter would leave them waiting forever instead.
on:
  pull_request:

permissions:
  contents: read

# a new push to the pull request replaces a run still going
concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: pages, run: "tools/verify/pages.py", browsers: webkit}
          - {name: header, run: "tools/verify/header.py --built", browsers: "chromium webkit"}
          - {name: requests, run: "tools/verify/requests.py --built --base \"origin/$BASE_REF\"", browsers: webkit}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # requests.py reads the base branch's files to compare against
          fetch-depth: 0
      - name: See if anything checked changed
        id: changed
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" |
             grep -qE '^(site/|mfl/|tools/verify/|tools/build\.mjs$|tests/fixtures/pages/|package(-lock)?\.json$|\.github/workflows/browser-checks\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing these checks cover changed; passing without running them."
          fi
        env:
          BASE_REF: ${{ github.base_ref }}
      - if: steps.changed.outputs.run
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: steps.changed.outputs.run
        run: npm ci
      - if: steps.changed.outputs.run
        uses: astral-sh/setup-uv@v10.3.3
      - if: steps.changed.outputs.run
        name: Install ${{ matrix.browsers }}
        run: uv run --no-project --with playwright==1.64.1 playwright install --with-deps ${{ matrix.browsers }}
      - if: steps.changed.outputs.run
        run: uv run --no-project --with playwright==1.64.1 python ${{ matrix.run }}
        env:
          BASE_REF: ${{ github.base_ref }}
